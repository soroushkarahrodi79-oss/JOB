name: W01 visual formatting one-time
on:
  push:
    branches: ['gate/4-w01-worker-home']
    paths: ['.github/workflows/w01-visual-format-once.yml']
permissions:
  contents: write
jobs:
  format-worker-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate/4-w01-worker-home
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned Prettier only to W-01 page
        shell: bash
        run: |
          pnpm exec prettier --write apps/web/app/worker/page.tsx
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/worker/page.tsx
          git diff --cached --quiet || git commit -m 'Apply pinned Prettier to W-01 visual refinement'
          git push origin HEAD:gate/4-w01-worker-home
