name: W04 evidence bounded retry

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/zz-w04-evidence-retry.yml']

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'gate/4-w04-accepted-terms-evidence' && github.event.pull_request.head.repo.full_name == 'soroushkarahrodi79-oss/JOB'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate/4-w04-accepted-terms-evidence
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Apply original bounded integration with whitespace-tolerant matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, re
          original = Path('.github/workflows/zz-w04-terms-one-time.yml').read_text(encoding='utf-8')
          script = textwrap.dedent(original.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY', 1)[0])
          start = script.index("demo='packages/application/src/demo-session.ts'")
          prelude = '''from pathlib import Path
          import re
          def edit(path, before, after):
              file = Path(path)
              content = file.read_text(encoding='utf-8')
              matches = list(re.finditer(r'\\s*'.join(re.escape(line.strip()) for line in before.splitlines() if line.strip()), content, re.S))
              if len(matches) != 1:
                  raise RuntimeError(f'{path}: expected one matching fragment, got {len(matches)} for {before[:75]!r}')
              match = matches[0]
              file.write_text(content[:match.start()] + after + content[match.end():], encoding='utf-8')
          '''
          exec(compile(textwrap.dedent(prelude) + script[start:], '<bounded-w04-integration>', 'exec'))
          PY
      - name: Format and test modified code
        run: |
          pnpm exec prettier --write packages/application/src/demo-session.ts packages/application/src/worker-response.ts packages/application/src/worker-response.test.ts apps/web/app/demo/session.tsx
          git diff --check
          pnpm --filter @platform/application typecheck
          pnpm --filter @platform/application test
      - name: Commit only reviewed feature files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/application/src/demo-session.ts packages/application/src/worker-response.ts packages/application/src/worker-response.test.ts apps/web/app/demo/session.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Record copied acceptance terms and append-only engagement events'
            git push origin HEAD:gate/4-w04-accepted-terms-evidence
          fi
