name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (provides the pinned pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Frozen lockfile: the committed lockfile is the single source of truth (D15 / ADR-0008).
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Rendered verification (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  portability:
    name: Generic Docker build-and-run (ADR-0008 c3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build on a stock node image and run in a plain container — no managed platform.
      - run: docker build -t platform-web:ci .
      - name: Run the container and confirm it serves
        run: |
          docker run -d --name web -p 3000:3000 platform-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/gate2-verification > /dev/null; then
              echo "served OK"; SERVED=1; break
            fi
            sleep 2
          done
          docker logs web
          docker rm -f web
          test "${SERVED:-0}" = "1"

  w05-once:
    name: One-time W-05 branch integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/gate/4-w05-arrival-checkin' && github.event.head_commit.message == 'Activate W05 integration script'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate/4-w05-arrival-checkin
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: python3 .github/scripts/w05_integrate.py
      - name: Format and validate bounded code
        run: |
          pnpm exec prettier --write packages/application/src/demo-session.ts packages/application/src/index.ts packages/application/src/arrival-check-in.ts packages/application/src/arrival-check-in.test.ts apps/web/app/demo/session.tsx apps/web/app/worker/page.tsx apps/web/app/employer/page.tsx 'apps/web/app/worker/opportunity/[opportunityId]/respond/page.tsx' 'apps/web/app/worker/opportunity/[opportunityId]/engagement/page.tsx' 'apps/web/app/employer/opportunity/[opportunityId]/arrival/page.tsx' apps/web/tests/e2e/worker-arrival-slice.spec.ts
          git diff --check
          pnpm build:tokens
          pnpm typecheck
          pnpm lint
          pnpm lint:css
          pnpm test
      - name: Commit feature changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/application/src/demo-session.ts packages/application/src/index.ts packages/application/src/arrival-check-in.ts packages/application/src/arrival-check-in.test.ts apps/web/app/demo/session.tsx apps/web/app/worker/page.tsx apps/web/app/employer/page.tsx 'apps/web/app/worker/opportunity/[opportunityId]/respond/page.tsx' 'apps/web/app/worker/opportunity/[opportunityId]/engagement/page.tsx' 'apps/web/app/employer/opportunity/[opportunityId]/arrival/page.tsx' apps/web/tests/e2e/worker-arrival-slice.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Wire W-05 check-in to existing demo session'
            git push origin HEAD:gate/4-w05-arrival-checkin
          fi
