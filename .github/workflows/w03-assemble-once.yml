name: W03 one-time integration
on:
  push:
    branches: ['gate/4-w03-simulated-verification']
    paths: ['.github/workflows/w03-assemble-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate/4-w03-simulated-verification
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Patch W-03 integration at verified anchors only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, changes):
              target = Path(path)
              data = target.read_text()
              for original, replacement in changes:
                  assert data.count(original) == 1, f'{path}: expected exactly one occurrence of {original[:80]!r}; found {data.count(original)}'
                  data = data.replace(original, replacement, 1)
              target.write_text(data)

          edit('packages/application/src/demo-session.ts', [
              ("import type { ValidatedOpportunityInput } from './opportunity-input';", "import type { ValidatedOpportunityInput } from './opportunity-input';\nimport type { DemoIdentityAttempt } from './worker-verification';"),
              ('  readonly notifications: readonly DemoNotification[];\n', '  readonly notifications: readonly DemoNotification[];\n  /** Synthetic verification outcomes for W-03. Never stores an identifier or document. */\n  readonly identityAttempts: readonly DemoIdentityAttempt[];\n'),
              ('    notifications: [],\n', '    notifications: [],\n    identityAttempts: [],\n'),
          ])

          edit('packages/application/src/worker-verification.ts', [
              ('/** Only a fictional provider outcome is stored:', "export type IdentityDemoOutcome = 'Success' | 'Rejected' | 'Timeout';\n\n/** Only a fictional provider outcome is stored:"),
          ])

          edit('packages/application/src/index.ts', [
              ("export {\n  employerHomeModel,", "export {\n  lastIdentityAttempt,\n  recordSimulatedIdentityOutcome,\n  type DemoIdentityAttempt,\n  type IdentityDemoOutcome,\n} from './worker-verification';\nexport {\n  employerHomeModel,"),
          ])

          edit('apps/web/app/demo/session.tsx', [
              ("import {\n  createContext,", "import { SimulatedIdentityVerificationAdapter } from '@platform/adapters';\nimport {\n  createContext,"),
              ("  publishOpportunity,\n  selectActor,", "  publishOpportunity,\n  recordSimulatedIdentityOutcome,\n  selectActor,"),
              ("  type FactorAnswerKey,\n  type ValidatedOpportunityInput,", "  type FactorAnswerKey,\n  type IdentityDemoOutcome,\n  type ValidatedOpportunityInput,"),
              ("  readonly invite: (opportunityId: string, workerId: string) => void;\n", "  readonly invite: (opportunityId: string, workerId: string) => void;\n  readonly simulateIdentityCheck: (\n    opportunityId: string,\n    outcome: IdentityDemoOutcome,\n  ) => Promise<void>;\n"),
              ("    return raw === null ? null : (JSON.parse(raw) as DemoSession);", "    if (raw === null) return null;\n    const stored = JSON.parse(raw) as DemoSession;\n    return { ...stored, identityAttempts: stored.identityAttempts ?? [] };"),
              ("      abandonDraft: () => {", "      simulateIdentityCheck: async (opportunityId, outcome) => {\n        // The three explicit demo controls configure an existing simulated port, not a real\n        // verification rail. No personal data is entered or transmitted.\n        const response =\n          outcome === 'Success'\n            ? {\n                ok: true as const,\n                value: {\n                  verifiedAt: session.now,\n                  source: 'SimulatedIdentityProvider' as const,\n                },\n              }\n            : outcome === 'Rejected'\n              ? {\n                  ok: false as const,\n                  failure: {\n                    kind: 'Rejected' as const,\n                    recoverable: false as const,\n                    reason: 'Demonstration rejection',\n                  },\n                }\n              : {\n                  ok: false as const,\n                  failure: { kind: 'Timeout' as const, recoverable: true as const },\n                };\n        const adapter = new SimulatedIdentityVerificationAdapter([response]);\n        const result = await adapter.verifyWorker('WKR-DEMO-01');\n        apply((current) =>\n          recordSimulatedIdentityOutcome(current, {\n            opportunityId,\n            workerId: 'WKR-DEMO-01',\n            result,\n          }),\n        );\n      },\n      abandonDraft: () => {"),
          ])

          edit('apps/web/app/worker/opportunity/[opportunityId]/page.tsx', [
              ("                بررسی هویت (<Latin>W-03</Latin>) و پذیرش یا رد دعوت (<Latin>W-04</Latin>) هنوز ساخته\n                نشده‌اند — <Latin>PLANNED</Latin>. مشاهدهٔ این صفحه هیچ تغییری در وضعیت همکاری، تعهد\n                پرداخت یا پیام ثبت‌شده نمی‌دهد.", "                بررسی آزمایشی هویت (<Latin>W-03</Latin>) اکنون برای همین دعوت در دسترس است.\n                مشاهدهٔ این صفحه هیچ تغییری در وضعیت همکاری، تعهد پرداخت یا پیام ثبت‌شده نمی‌دهد.\n              </p>\n              <Link\n                href={`/worker/opportunity/${opportunityId}/verify`}\n                className={styles.back}\n                data-testid=\"worker-verification-link\"\n              >\n                رفتن به بررسی آزمایشی هویت\n              </Link>\n              <p className=\"type-detail\">\n                پذیرش یا رد دعوت (<Latin>W-04</Latin>) هنوز ساخته نشده است —{' '}\n                <Latin>PLANNED</Latin>. تکمیل بررسی آزمایشی، دعوت را نمی‌پذیرد."),
          ])
          PY
          pnpm exec prettier --write packages/application/src/demo-session.ts packages/application/src/worker-verification.ts packages/application/src/worker-verification.test.ts packages/application/src/index.ts apps/web/app/demo/session.tsx 'apps/web/app/worker/opportunity/[opportunityId]/page.tsx' 'apps/web/app/worker/opportunity/[opportunityId]/verify/page.tsx' 'apps/web/app/worker/opportunity/[opportunityId]/verify/verification.module.css' apps/web/tests/e2e/worker-verification-slice.spec.ts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/application/src/demo-session.ts packages/application/src/worker-verification.ts packages/application/src/worker-verification.test.ts packages/application/src/index.ts apps/web/app/demo/session.tsx 'apps/web/app/worker/opportunity/[opportunityId]/page.tsx' 'apps/web/app/worker/opportunity/[opportunityId]/verify/page.tsx' 'apps/web/app/worker/opportunity/[opportunityId]/verify/verification.module.css' apps/web/tests/e2e/worker-verification-slice.spec.ts
          git diff --cached --quiet || git commit -m 'Integrate W-03 into the shared demo invitation flow'
          git push origin HEAD:gate/4-w03-simulated-verification
