name: PR9 one-time SH03 test transition
on:
  push:
    branches:
      - gate/4-sh03-notification-outbox
permissions:
  contents: write
jobs:
  update-existing-test:
    if: github.event.head_commit.message == 'Run SH-03 targeted test transition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate/4-sh03-notification-outbox
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Reconcile only obsolete SH03 assertions and commit
        run: |
          python3 .github/scripts/sh03_reconcile.py
          pnpm exec prettier --write apps/web/tests/e2e/employer-need-slice.spec.ts
          git diff --check
          git diff -- apps/web/tests/e2e/employer-need-slice.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/tests/e2e/employer-need-slice.spec.ts
          git commit -m 'Reconcile E-01 tests with built SH-03 navigation'
          git push origin HEAD:gate/4-sh03-notification-outbox
