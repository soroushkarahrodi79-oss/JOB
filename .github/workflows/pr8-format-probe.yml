name: PR8 formatting probe (temporary)
on:
  push:
    branches:
      - gate/4-candidate-list
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Show exact formatting changes without committing
        run: |
          pnpm exec prettier --write packages/application/src/demo-session.ts packages/application/src/pr8-final-guards.test.ts
          git diff -- packages/application/src/demo-session.ts packages/application/src/pr8-final-guards.test.ts
