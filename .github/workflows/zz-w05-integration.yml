name: W05 one-time integration

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/zz-w05-integration.yml']

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'gate/4-w05-arrival-checkin' && github.event.pull_request.head.repo.full_name == 'soroushkarahrodi79-oss/JOB'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate/4-w05-arrival-checkin
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Wire bounded W-05 session and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, before, after):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              count=s.count(before)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence, saw {count} for {before[:100]!r}')
              p.write_text(s.replace(before, after),encoding='utf-8')

          demo='packages/application/src/demo-session.ts'
          edit(demo, "import type { DemoIdentityAttempt } from './worker-verification';", "import type { DemoIdentityAttempt } from './worker-verification';\nimport type { DemoArrivalCode } from './arrival-check-in';")
          edit(demo, "  readonly state: 'Offered' | 'Accepted' | 'Declined';", "  readonly state: 'Offered' | 'Accepted' | 'Declined' | 'InProgress';")
          edit(demo, '  readonly declinedAt?: string;', '  readonly declinedAt?: string;\n  readonly arrivedAt?: string;')
          edit(demo, "  | {\n      readonly id: string;\n      readonly engagementId: string;\n      readonly kind: 'Accepted';", "  | {\n      readonly id: string;\n      readonly engagementId: string;\n      readonly kind: 'ArrivedSimulated';\n      readonly recordedAt: string;\n      readonly source: 'DemoSharedCode';\n    }\n  | {\n      readonly id: string;\n      readonly engagementId: string;\n      readonly kind: 'Accepted';")
          edit(demo, '  readonly engagementEvents: readonly DemoEngagementEvent[];', '  readonly engagementEvents: readonly DemoEngagementEvent[];\n  readonly arrivalCodes: readonly DemoArrivalCode[];')
          edit(demo, '    engagementEvents: [],', '    engagementEvents: [],\n    arrivalCodes: [],')

          index='packages/application/src/index.ts'
          with Path(index).open('a', encoding='utf-8') as f:
              f.write("\nexport {\n  advanceDemoClockToShiftStart,\n  checkInWithDemoCode,\n  issueDemoArrivalCode,\n  type DemoArrivalCode,\n} from './arrival-check-in';\n")

          session='apps/web/app/demo/session.tsx'
          edit(session, '  answerFactor,\n  createOpportunity,', '  answerFactor,\n  advanceDemoClockToShiftStart,\n  checkInWithDemoCode,\n  createOpportunity,')
          edit(session, '  initialDemoSession,\n  inviteWorker,', '  initialDemoSession,\n  inviteWorker,\n  issueDemoArrivalCode,')
          edit(session, '  readonly abandonDraft: () => void;', '  readonly issueArrivalCode: (opportunityId: string) => void;\n  readonly advanceScenarioClock: (opportunityId: string) => void;\n  readonly checkIn: (opportunityId: string, code: string) => void;\n  readonly abandonDraft: () => void;')
          edit(session, '      engagementEvents: stored.engagementEvents ?? [],', '      engagementEvents: stored.engagementEvents ?? [],\n      arrivalCodes: stored.arrivalCodes ?? [],')
          edit(session, '      abandonDraft: () => {\n        apply(discardDraft);', '''      issueArrivalCode: (opportunityId) => {
                  apply((current) => issueDemoArrivalCode(current, opportunityId));
                },
                advanceScenarioClock: (opportunityId) => {
                  apply((current) => advanceDemoClockToShiftStart(current, opportunityId));
                },
                checkIn: (opportunityId, code) => {
                  apply((current) => checkInWithDemoCode(current, { opportunityId, code }));
                },
                abandonDraft: () => {
                  apply(discardDraft);''')

          worker='apps/web/app/worker/page.tsx'
          edit(worker, "item.state === 'Offered' ? 'پاسخ به دعوت' : 'دیدن پاسخ ثبت‌شده'", "item.state === 'Accepted' || item.state === 'InProgress'\n                        ? 'جزئیات همکاری و ورود به شیفت'\n                        : item.state === 'Offered' ? 'پاسخ به دعوت' : 'دیدن پاسخ ثبت‌شده'")
          edit(worker, 'href={`/worker/opportunity/${item.opportunityId}/respond`}', "href={item.state === 'Accepted' || item.state === 'InProgress'\n                        ? `/worker/opportunity/${item.opportunityId}/engagement`\n                        : `/worker/opportunity/${item.opportunityId}/respond`}")
          edit(worker, "                      <Latin>{item.state}</Latin>", "                      <Latin>{item.state}</Latin>")
          edit(worker, "                          ? 'شرایط پذیرفته شده‌اند؛ شروع کار و پرداخت هنوز ثبت نشده‌اند.'", "                          ? 'شرایط پذیرفته شده‌اند؛ ورود به شیفت جداگانه ثبت می‌شود و پرداختی انجام نشده است.'")
          edit(worker, "                          : 'کارگر این دعوت را رد کرده است؛ رد دعوت به‌خودی‌خود سیگنال قابلیت اعتماد نیست.'", "                          : item.state === 'InProgress'\n                            ? 'ورود با کد برای ساعت ساختگی سناریو ثبت شده است؛ نه مدرک حضور واقعی و نه پرداخت.'\n                            : 'کارگر این دعوت را رد کرده است؛ رد دعوت به‌خودی‌خود سیگنال قابلیت اعتماد نیست.'")
          edit(worker, "                حضور در کار و سابقهٔ تکمیل‌شده هنوز در این برش ساخته نشده‌اند —", "                تکمیل کار و سابقهٔ تکمیل‌شده هنوز در این برش ساخته نشده‌اند —")

          employer='apps/web/app/employer/page.tsx'
          edit(employer, '''      <p className="type-detail" data-testid="candidates-link">''', '''      <p className="type-detail" data-testid="arrival-link">
                <Link
                  className={`type-body-strong ${styles.inlineLink}`}
                  href={`/employer/opportunity/${record.id}/arrival`}
                >
                  کد ورود نمایشیِ همکاری پذیرفته‌شده (<Latin>E-06</Latin>)
                </Link>
              </p>
              <p className="type-detail" data-testid="candidates-link">''')

          response='apps/web/app/worker/opportunity/[opportunityId]/respond/page.tsx'
          edit(response, '''            <Link href="/worker">بازگشت به کارهای من</Link>
          </section>
        ) : engagement.state === 'Declined' ? (''', '''            <Link href={`/worker/opportunity/${opportunityId}/engagement`} data-testid="worker-engagement-link">
                دیدن شرایط پذیرفته‌شده و ورود به شیفت
              </Link>
              <Link href="/worker">بازگشت به کارهای من</Link>
          </section>
        ) : engagement.state === 'Declined' ? (''')
          PY
      - name: Format and validate W-05 files
        run: |
          pnpm exec prettier --write packages/application/src/demo-session.ts packages/application/src/index.ts packages/application/src/arrival-check-in.ts packages/application/src/arrival-check-in.test.ts apps/web/app/demo/session.tsx apps/web/app/worker/page.tsx apps/web/app/employer/page.tsx 'apps/web/app/worker/opportunity/[opportunityId]/respond/page.tsx' 'apps/web/app/worker/opportunity/[opportunityId]/engagement/page.tsx' 'apps/web/app/employer/opportunity/[opportunityId]/arrival/page.tsx' apps/web/tests/e2e/worker-arrival-slice.spec.ts
          git diff --check
          pnpm build:tokens
          pnpm typecheck
          pnpm lint
          pnpm lint:css
          pnpm test
      - name: Commit bounded W-05 files to same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/application/src/demo-session.ts packages/application/src/index.ts packages/application/src/arrival-check-in.ts packages/application/src/arrival-check-in.test.ts apps/web/app/demo/session.tsx apps/web/app/worker/page.tsx apps/web/app/employer/page.tsx 'apps/web/app/worker/opportunity/[opportunityId]/respond/page.tsx' 'apps/web/app/worker/opportunity/[opportunityId]/engagement/page.tsx' 'apps/web/app/employer/opportunity/[opportunityId]/arrival/page.tsx' apps/web/tests/e2e/worker-arrival-slice.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Wire W-05 employer code and worker check-in journey'
            git push origin HEAD:gate/4-w05-arrival-checkin
          fi
