name: W04 final formatting

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/zz-w04-final-format.yml']

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'gate/4-w04-worker-response' && github.event.pull_request.head.repo.full_name == 'soroushkarahrodi79-oss/JOB'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate/4-w04-worker-response
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/worker/page.tsx packages/application/src/worker-response.test.ts
      - run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/worker/page.tsx packages/application/src/worker-response.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Format final W-04 worker view and tests'
            git push origin HEAD:gate/4-w04-worker-response
          fi
